# One pulls the encrypted archives as tw-backup: SFTP only, read only, jailed
# in /srv/tw/backups, with the one key One holds for it (02 section 7).
Match User tw-backup
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ChrootDirectory /srv/tw/backups
    ForceCommand internal-sftp -R
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    X11Forwarding no
    PermitTTY no
