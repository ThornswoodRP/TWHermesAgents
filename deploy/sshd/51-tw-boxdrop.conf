# The box sends its nightly encrypted backups as tw-boxdrop (Patrick, 31 Oct,
# #2862): SFTP only, key only, from the box's address only, jailed in
# /srv/tw/boxdrop. It can add a file to /in and nothing else: no reading or
# listing (denied by -P, and every file it makes is mode 000 by -u 0777, so
# not even its owner can open one again, which also stops an overwrite), no
# rename, no remove, no change of mode or time, no link, no folder. Its key
# works only from the box's address (from= in its authorized_keys line, which
# install.sh writes). A stolen box cannot reach a copy it already sent.
# Root's intake moves each finished file away.
Match User tw-boxdrop
    AuthorizedKeysFile /etc/ssh/authorized_keys/%u
    ChrootDirectory /srv/tw/boxdrop
    ForceCommand internal-sftp -d /in -u 0777 -P read,opendir,readdir,readlink,remove,rename,posix-rename,setstat,fsetstat,lsetstat,hardlink,symlink,mkdir,rmdir,copy-data
    AuthenticationMethods publickey
    PasswordAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    X11Forwarding no
    PermitTTY no
