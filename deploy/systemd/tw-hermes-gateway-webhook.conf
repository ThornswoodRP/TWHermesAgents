# A drop-in for tw-hermes-gateway.service, placed by deploy/install.sh at
# /etc/systemd/system/tw-hermes-gateway.service.d/50-github-webhook.conf.
# Bramble's wake (policy `wake`): systemd reads the file as root before it
# starts the gateway as hermes, so the secret GitHub signs Bramble's App's
# events with reaches only the gateway's environment, where Hermes's webhook
# receiver reads WEBHOOK_SECRET. The hermes user cannot open the file, and no
# config.yaml holds the secret.
[Service]
EnvironmentFile=/etc/thornswood/github-webhook.env
