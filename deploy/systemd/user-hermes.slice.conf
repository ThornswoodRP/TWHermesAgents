# the hermes user's own manager: the Tier A podman containers.
# Installed as /etc/systemd/system/user-<uid of hermes>.slice.d/50-thornswood.conf.
# Generated from thornswood_guard/policy.yaml by scripts/render_units.py; do not edit by hand.
# A limit changes only by a PR to the policy, never on the box.
[Slice]
MemoryAccounting=yes
CPUAccounting=yes
TasksAccounting=yes
MemoryHigh=3584M
MemoryMax=4G
CPUQuota=100%
TasksMax=1024
