# needrestart never restarts a run of the VM's oneshot units (deploy/install.sh
# step 8 places this in /etc/needrestart/conf.d).
#
# Each of these is one finite run that a timer starts again, so a run that
# maps an old library is gone within minutes and the next run maps the new
# one. Restarting it means killing that run half done. On 26 Nov 2026 the
# unattended upgrade of libexpat1 at 13:39:58 UTC was followed at 13:40:03 by
# a stop of every service holding the old library, tw-follow-main.service
# among them, while it was applying main 6ac15c24 after its install had
# already pointed current at it; nothing applied it until a person looked.
# The long-running services (the brokers, the decision core, the gateway)
# stay restarted as usual, so they take the fixed library at once.
#
# tests/test_deploy.py checks that every Type=oneshot unit in deploy/ is here.
$nrconf{override_rc}{qr(^tw-follow-main\.service$)} = 0;
$nrconf{override_rc}{qr(^tw-backup\.service$)} = 0;
$nrconf{override_rc}{qr(^tw-offsite\.service$)} = 0;
$nrconf{override_rc}{qr(^tw-snapshot\.service$)} = 0;
$nrconf{override_rc}{qr(^tw-sweep\.service$)} = 0;
$nrconf{override_rc}{qr(^tw-limits-check\.service$)} = 0;
$nrconf{override_rc}{qr(^tw-decide-feed\.service$)} = 0;
$nrconf{override_rc}{qr(^tw-decide-peers\.service$)} = 0;
