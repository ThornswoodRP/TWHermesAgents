# The gateway's own profile, as scripts/apply.py sets it in
# /home/hermes/.hermes/config.yaml: the hermes user's default profile, which
# tw-hermes-gateway runs as. It is not a Bot. It holds the Discord connection
# and makes the gateway's own helper calls, so it gets one route (the Max
# login every Bot has first, no fallback), the helpers on it, and the guard,
# which refuses every tool in a profile that is not one of the six Bots.
# Generated from thornswood_guard/policy.yaml by scripts/render_profiles.py;
# do not edit by hand. Every key not listed here stays as Hermes has it.
# `model` and `fallback_providers` are replaced whole.
model:
  provider: anthropic
  default: claude-opus-5-5
fallback_providers: []
agent:
  service_tier: ''
  disabled_toolsets:
  - browser
  - code_execution
  - computer_use
  - connections
  - catalog
  - image_gen
  - video_gen
  - tts
  - web
  - search
  - x_search
  - discord
  - discord_admin
  - delegation
  - cronjob
auxiliary:
  free_only: true
  openrouter_model: ''
  vision:
    provider: anthropic
    model: claude-opus-5-5
  title_generation:
    model_upgrade_enabled: false
  background_review:
    enabled: false
curator:
  enabled: false
approvals:
  mode: manual
  cron_mode: deny
  unattended_mode: deny
  single_query_mode: deny
  deny:
  - git push*
  - '*git push *'
  - gh pr merge*
  - '*gh pr merge*'
  - gh pr create*
  - gh workflow run*
  - '*gh workflow run*'
  - gh api * -X *
  - gh api * --method *
  - gh label *
  - gh issue edit*
  - gh secret*
  - gh variable*
  - gh ruleset*
  - gh auth login*
  - gh auth token*
  - '*cat *auth.json*'
  - '*printenv*'
  - '*/proc/*/environ*'
  - sudo *
plugins:
  enabled:
  - thornswood_guard
  auto_apply: false
  auto_update_check_hours: 0
  hook_callback_timeout: 30
hooks_auto_accept: false
security:
  redact_secrets: true
