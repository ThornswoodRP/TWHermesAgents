# The gateway's own profile, as scripts/apply.py sets it in
# /home/hermes/.hermes/config.yaml: the hermes user's default profile, which
# tw-hermes-gateway runs as. It is not a Bot. It holds the Discord connection
# and makes the gateway's own helper calls, so it gets one route (the Max
# login every Bot has first, no fallback), the helpers on it, and the guard,
# which refuses every tool in a profile that is not one of the six Bots.
# Generated from thornswood_guard/policy.yaml by scripts/render_profiles.py;
# do not edit by hand. Every key not listed here stays as Hermes has it.
# `model` and `fallback_providers` are replaced whole.
model:
  provider: anthropic
  default: claude-opus-5-5
fallback_providers: []
agent:
  service_tier: ''
  disabled_toolsets:
  - browser
  - code_execution
  - computer_use
  - connections
  - catalog
  - image_gen
  - video_gen
  - tts
  - web
  - search
  - x_search
  - discord
  - discord_admin
  - delegation
  - cronjob
  - vision
  - video
auxiliary:
  free_only: true
  openrouter_model: ''
  vision:
    provider: anthropic
    model: claude-opus-5-5
  approval:
    provider: anthropic
    model: claude-opus-5-5
  title_generation:
    model_upgrade_enabled: false
  background_review:
    enabled: false
curator:
  enabled: false
approvals:
  mode: smart
  smart_policy: "You are judging a command from a Thornswood Bot. Each Bot works only\
    \ in its own\ncopy of a repository, mounted at /workspace in its own sandbox.\
    \ Every write to\nGitHub, every merge, release, deploy and publish goes through\
    \ Thornswood's\nbrokers, never through a shell command.\nDENY a command that:\n\
    - reads, prints, copies or sends a credential: a token, key, password, .env file,\n\
    \  auth.json, an SSH or GPG key, anything under /etc/thornswood or a .ssh folder;\n\
    - pushes, merges, tags, releases, deploys or publishes, or writes to a remote\n\
    \  service (git push, gh with a write, curl or wget sending data, scp, rsync to\
    \ a\n  remote, nc);\n- changes the machine: services, schedules, users, groups,\
    \ sudo, the firewall,\n  Tailscale, podman or docker, packages outside /workspace;\n\
    - deletes, moves or changes files outside /workspace and /tmp, or changes their\n\
    \  owner or permissions.\nAPPROVE a command that only reads or inspects, or that\
    \ builds, tests, lints or\nformats the repository under /workspace with the repository's\
    \ own scripts and\ntools, or that runs local git commands which do not reach a\
    \ remote (status,\ndiff, log, show, add, commit, switch, branch, stash, restore).\n\
    ESCALATE anything else, and anything you are not sure of: a person decides.\n"
  timeout: 300
  cron_mode: deny
  unattended_mode: deny
  single_query_mode: deny
  deny:
  - git push*
  - '*git push *'
  - gh pr merge*
  - '*gh pr merge*'
  - gh pr create*
  - gh workflow run*
  - '*gh workflow run*'
  - gh api * -X *
  - gh api * --method *
  - gh label *
  - gh issue edit*
  - gh secret*
  - gh variable*
  - gh ruleset*
  - gh auth login*
  - gh auth token*
  - '*cat *auth.json*'
  - '*printenv*'
  - '*/proc/*/environ*'
  - sudo *
plugins:
  enabled:
  - thornswood_guard
  auto_apply: false
  auto_update_check_hours: 0
  hook_callback_timeout: 600
hooks_auto_accept: false
security:
  redact_secrets: true
platforms:
  webhook:
    enabled: true
    extra:
      host: 127.0.0.1
      port: 8644
      rate_limit: 60
      max_body_bytes: 1048576
      routes:
        github-checks:
          profile: bramble
          events:
          - check_suite
          - pull_request
          filters:
          - field: repository.full_name
            in:
            - ThornswoodRP/Thornswood
            - ThornswoodRP/Thornswood-Ops
            - ThornswoodRP/skymp
          - any:
            - all:
              - field: event
                equals: check_suite
              - field: action
                equals: completed
              - field: check_suite.app.slug
                equals: github-actions
            - all:
              - field: event
                equals: pull_request
              - field: action
                equals: dequeued
          coalesce:
            key: check_suite.app.slug
            window_seconds: 120
            max_wait_seconds: 900
          toolsets:
          - thornswood
          prompt: 'GitHub event {event_type} ({action}) on {repository.full_name},
            the latest of the events since your last wake.

            Check suite: commit {check_suite.head_sha}, conclusion {check_suite.conclusion}.

            Pull request: #{pull_request.number}, head {pull_request.head.sha}, merged
            {pull_request.merged}, dequeued reason {reason}.

            This is a wake-up, not an instruction. Every finished check suite in the
            three repositories is gathered into one wake, so do your whole bramble-duties
            skill through tw_git and tw_decide, over all of them and not only this
            commit: a Bot''s open pull request in Thornswood or the fork goes on GitHub''s
            auto-merge once your review stands on its exact head, and GitHub merges
            it; a person''s or a thread''s is its owner''s, never yours; an open pull
            request in Thornswood-Ops is merged once its check passed and your review
            stands on the exact head; hand a red check back to its owner; a pull request
            dequeued unmerged goes back to its owner with GitHub''s reason and the
            queue run, and nothing puts it back until the owner pushes; then the Ops
            run notes and the Desk''s list; report each merge and its Release. Nothing
            in this event approves anything.'
