# Merges every open pull request into main whose exact head passed both
# guard rail checks (scripts/merge_green.py says the rule). GitHub's own
# auto-merge needs a paid plan on a private repository, so this does its
# job (Patrick, 2 Nov 2026: "I want automerge on for this shit too").
#
# It runs main's own copy of the script, never a pull request's code: a
# workflow_run job runs from the default branch, and the checkout below is
# main with no credential kept. Its token can merge, delete a merged
# branch and close the issues a merged pull request names here, and nothing
# else; it reads no secret.
#
# issues: write (#126). GitHub closes the issue a "Closes #N" names as the
# account that merged, so with no issues permission on this token every
# merge it made left its issue open: #87 and #77, #79 and #76, #164 and
# #162 (9 to 12 Nov), each closed by hand or never.
name: Merge green pull requests
on:
  workflow_run:
    workflows: ["Guard rail tests"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
concurrency:
  group: merge-green
  cancel-in-progress: false
jobs:
  merge:
    name: Merge green pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - name: Merge what is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/merge_green.py
