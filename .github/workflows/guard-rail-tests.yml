# The guard rail tests on GitHub's own runners, so a merge here needs no
# machine of Patrick's (31 Oct: nothing runs on One any more).
#
# Linux runs the VM's Python (3.12) and Windows runs One's (3.13), each with
# PyYAML and, once the decision core's install is merged, its venv libraries,
# all from hash-pinned wheels. The job holds no
# secret and can write nothing: read-only contents, no persisted credential.
# The repository is public, so GitHub's standard runners cost nothing, and
# no job may run on a runner of ours: a public repository's pull request can
# name any runner label, and ours sit on the VM and the box.
# tests/test_ci_workflow.py holds both.
name: Guard rail tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guard-rail-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Guard rail tests (${{ matrix.where }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - where: VM's Python
            os: ubuntu-24.04
            python: "3.12"
          - where: One's Python
            os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      # GitHub's Windows images carry Git's bash on PATH and One runs the
      # suite in Git Bash, but the box's runner has only what Windows puts on
      # PATH for every service (Git's cmd folder, without bash). The next
      # step and the suite's bash tests need it, so the Windows job takes
      # Git for Windows' own bin, and stops here if it is not there.
      - name: Git's bash on Windows, as on One
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:ProgramFiles 'Git\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $bin 'bash.exe'))) { throw "Git for Windows has no bash.exe at $bin" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
      # The VM's node is Ubuntu's own package, which deploy/install.sh 6b
      # installs (18 on noble), and the suite's node tests run whatever node
      # is first on PATH. The runner's own node is newer, so the VM's job puts
      # Ubuntu's first: on 10 Nov 2026 a pane test that needed node 19 went
      # red on the VM alone and stopped its installs.
      - name: Ubuntu's node first, as on the VM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -q >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends nodejs >/dev/null
          mkdir -p "$RUNNER_TEMP/vm-node"
          ln -sf /usr/bin/node "$RUNNER_TEMP/vm-node/node"
          echo "$RUNNER_TEMP/vm-node" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vm-node/node" --version
      - name: Libraries, by hash
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: --no-deps -r tests/requirements-ci.txt
          if [ -f deploy/decisions/requirements.txt ]; then
            python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: --no-deps -r deploy/decisions/requirements.txt
          fi
      - name: The suite
        run: python -m unittest discover -s tests
