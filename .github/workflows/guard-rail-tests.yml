# The guard rail tests on GitHub's own runners, so a merge here needs no
# machine of Patrick's (31 Oct: nothing runs on One any more).
#
# Linux runs the VM's Python (3.12) and Windows runs One's (3.13), each with
# PyYAML and, once the decision core's install is merged, its venv libraries,
# all from hash-pinned wheels. The job holds no
# secret and can write nothing: read-only contents, no persisted credential.
# GitHub's included minutes for a private repository ran out on 2 Nov 2026
# (Hermes used 476 Linux and 834 Windows minutes in two days) and the
# spending limit stays at $0, so both checks run on runners of our own
# (Patrick's A on q-hermes-ci-free-runners, 3 Nov): Linux on the Oracle VM
# (deploy/runner: the tw-runner user, its own folder, a network that reaches
# only GitHub and the package feeds) and Windows on the box, each under a
# user of its own. Only this repository's own branches run here: a fork's
# pull request runs no workflow in a private repository.
name: Guard rail tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: guard-rail-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Guard rail tests (${{ matrix.where }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - where: VM's Python
            runner: tw-hermes-vm
            python: "3.12"
          - where: One's Python
            runner: tw-hermes-box
            python: "3.13"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      # GitHub's Windows images carry Git's bash on PATH and One runs the
      # suite in Git Bash, but the box's runner has only what Windows puts on
      # PATH for every service (Git's cmd folder, without bash). The next
      # step and the suite's bash tests need it, so the Windows job takes
      # Git for Windows' own bin, and stops here if it is not there.
      - name: Git's bash on Windows, as on One
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:ProgramFiles 'Git\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $bin 'bash.exe'))) { throw "Git for Windows has no bash.exe at $bin" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
      - name: Libraries, by hash
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: --no-deps -r tests/requirements-ci.txt
          if [ -f deploy/decisions/requirements.txt ]; then
            python -m pip install --disable-pip-version-check --require-hashes --only-binary :all: --no-deps -r deploy/decisions/requirements.txt
          fi
      - name: The suite
        run: python -m unittest discover -s tests
