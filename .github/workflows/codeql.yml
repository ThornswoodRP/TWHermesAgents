# Code scanning: GitHub's CodeQL reads the code for security faults and puts
# what it finds on the Security tab, which only people with write access read
# (Patrick, 12 Nov 2026, with Thornswood's and the fork's).
#
# WHAT IT READS. The three languages here, each from source with build-mode
# none, so nothing is built: the Bots' Python, the JavaScript of the app and
# its tests, and these workflows themselves (actions).
#
# WHICH QUERIES. The security-extended suite: the default security queries
# plus the ones of lower severity and precision. Not security-and-quality:
# GitHub Code Quality reads the same code for quality faults, and the two
# would raise each of those twice.
#
# WHAT IT RUNS ON. GitHub's standard runner, whose minutes cost nothing in
# this public repository. Never a runner of ours (the VM, the box): a pull
# request from another repository runs this, and tests/test_ci_workflow.py
# fails any job that is not on GitHub's own images. It reads no secret; a
# pull request from a fork runs it with a read-only token, and GitHub takes
# its results without one.
#
# This is CodeQL's advanced setup, a workflow in the repository, rather than
# its default setup, a switch in the settings: the actions are pinned here
# like every other workflow's, and a change to what is scanned is a pull
# request someone can read. Default setup refuses to run beside it, so it
# stays off. The actions are named by full commit SHA, with the tag beside
# it, at the same commits Thornswood's codeql.yml uses.
name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:${{ matrix.language }}
