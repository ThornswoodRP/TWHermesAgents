# The Bots' guard rails, as data. Every rule the code enforces reads its
# numbers and names from here, so a change to a rule is a change to this file,
# reviewed and merged by Patrick. docs/security.md says how each rule is held.

version: 1

owner: ThornswoodRP

repos:
  app: ThornswoodRP/Thornswood
  fork: ThornswoodRP/skymp
  ops: ThornswoodRP/Thornswood-Ops
  hermes: ThornswoodRP/TWHermesAgents

# Exactly six Bots. The ops file and the guide are skills, never Bots.
# `app` names which GitHub App the git broker uses for that Bot's writes.
bots:
  bramble:
    name: Bramble
    role: router
    app: bramble
    claim_label: "claimed: Bramble"
    rooms: [Thornswood Workbench]
    opens_working_rooms: true
    cron: true
  rift:
    name: Rift
    role: worker
    app: workers
    claim_label: "claimed: Rift"
    rooms: [Thornswood Workbench]
  sprocket:
    name: Sprocket
    role: worker
    app: workers
    claim_label: "claimed: Sprocket"
    rooms: [Thornswood Workbench]
  echo:
    name: Echo
    role: worker
    app: workers
    claim_label: "claimed: Echo"
    rooms: [Thornswood Workbench]
  magpie:
    name: Magpie
    role: worker
    app: workers
    claim_label: "claimed: Magpie"
    rooms: [Thornswood Workbench]
  wisp:
    name: Wisp
    role: worker
    app: workers
    claim_label: "claimed: Wisp"
    rooms: [Thornswood Workbench]
    fork_branches: true

# The two GitHub Apps (Patrick, 30 Oct). Only Bramble's may update main, and
# only through a pull request. The workers' App has no Workflows permission,
# so GitHub itself refuses a worker push that changes a workflow file.
github_apps:
  bramble:
    workflows: true
    may_merge: true
  workers:
    workflows: false
    may_merge: false

# One executor at a time (plan 01 phases 4 and 5; handoff of 31 Oct, Patrick's
# answer A). Until the cutover the Bots triage and plan read only (the shadow
# run), and Patrick's Hermes merges, releases and deploys: tw-git refuses every
# GitHub write a Bot asks for (push, pull request, comment, label, merge, run).
# At the cutover Patrick sets this to bramble by a PR here, and Bramble takes
# merge authority once. Nothing a Bot does can change it.
# The cutover: Patrick, 1 Nov 2:33 PM Mountain, "Bramble can take operational
# authority now"; 8 PM is the target for retiring Claude Code Projects, not a
# gate on the handoff. From this merge on Bramble is the one executor, and
# Patrick's Hermes and the Desk stop merging, releasing and deploying.
executor: bramble

merge:
  # The checks per repo that must each be a success on the exact head.
  # Skipped is not success. Read from each repo's PR builds.
  # Thornswood: since #5119 (31 Oct) every PR builds only on GitHub's runners
  # (build-pr.yml): "Launcher builds", then "Build check result", which passes
  # only when that build passed and is the one check main's ruleset requires.
  # The old "Launcher builds (VPS fallback)" job is gone from PR builds, so
  # naming it refused every merge.
  required_checks:
    ThornswoodRP/Thornswood: ["Launcher builds", "Build check result"]
    ThornswoodRP/Thornswood-Ops: ["check"]
    ThornswoodRP/skymp: ["build-pr"]
  method:
    ThornswoodRP/Thornswood: squash
    ThornswoodRP/Thornswood-Ops: squash
    ThornswoodRP/skymp: merge
  base:
    ThornswoodRP/Thornswood: main
    ThornswoodRP/Thornswood-Ops: main
    ThornswoodRP/skymp: thornswood/engine-changes
  # Where GitHub's own auto-merge does the merging (Patrick, 2 Nov 2026,
  # 12:33 PM: "He should just merge if he absolutely has to himself I
  # shouldn't need to approve" and "He shouldn't have to be merging to begin
  # with"), with the checks the base branch's rules must make GitHub wait
  # for. In these repos tw_git merge turns auto-merge on at the exact head and
  # GitHub merges once those checks pass (Thornswood's main through its merge
  # queue). It does so only for a Bot's own pull request, and only when
  # GitHub's rules on the branch, read just before, require every check
  # listed here. Thornswood's "Build check result" passes only when
  # "Launcher builds" did (build-pr.yml), and main's ruleset requires it. A
  # person's or a thread's pull request is its owner's to put on auto-merge.
  # Ops is private on GitHub Free, which has no auto-merge and no rules, so
  # its list is empty and Bramble merges an Ops pull request itself once its
  # check passed.
  auto_merge:
    ThornswoodRP/Thornswood: ["Build check result"]
    ThornswoodRP/Thornswood-Ops: []
    ThornswoodRP/skymp: ["build-pr"]
  # The robots' pull requests have no person or thread behind them, so
  # Bramble reviews them and turns auto-merge on as for a Bot's: Dependabot's
  # version bumps and the pin robot's engine pin (engine-pin.yml, where
  # Bramble already merged them under the merge rule).
  robot_authors: ["dependabot[bot]", "thornswood-pin-robot[bot]"]
  # Whose work may merge (Patrick, 8 Nov 2026, 1:30 PM: "don't ever let them
  # auto merge tho unless I saw that even if the PR is good unless I
  # specficallyt say that I want that person to automerge", and 1:31 PM:
  # "currently that list is only me and my team"). Before any merge tw-git
  # reads every commit of the pull request: its author, and each person a
  # Co-authored-by line credits, must be one of these people, a Bot (the
  # files broker's commit_email), a robot above or one of our own workflows
  # (workflow_authors). Work by anyone else, carried into a Bot's pull request
  # with credit, merges only once Patrick answered "let them merge" for that
  # person on their outside pull request card, which tw-git reads from the
  # decision core itself (#132), or once he puts them on this list, quoted
  # here with the date.
  auto_merge_people: ["EvilPatrick06", "WiccanDjinn"]
  # The commits our own workflows make (engine-pin.yml commits as GitHub
  # Actions for the pin robot's pull request).
  workflow_authors: ["github-actions[bot]"]
  # The label a pull request carrying outside work wears. Thornswood's
  # Auto-Merge.js leaves such a pull request alone whoever opened it
  # (Thornswood #5544). tw-git refuses to merge one that credits nobody with a
  # Co-authored-by line, because then the work's author cannot be read.
  outside_label: "outside work"

# What Bramble's release tooling may start. Nothing else, on main only.
runs:
  # Main releases without a yes for each one (Patrick, 31 Oct 19:13:56Z:
  # "temporarily allow main releases without asking me"; again 1 Nov 01:19Z,
  # main releases unlimited for now; and 1 Nov 8:06 PM, no yes for each step
  # of agreed work). Bramble starts a main run on the exact commit of main
  # like a dev one. Publishing a collection revision still needs his record.
  # Patrick sets this false by a PR here to need his word for each main
  # release again.
  main_without_patrick: true
  ref: main
  # The verb lists a run's gate line is checked against, read from main.
  verb_lists:
    - scripts/vps/gate/verbs.json
    - scripts/release/nexus-verbs.json
  repo: ThornswoodRP/Thornswood
  workflows:
    # box-run.yml lives in the private Ops repository since the VPS runners
    # moved there (Thornswood #4013, #4039): it checks out Thornswood's main
    # and runs a verb of main's verbs.json, so the line is still checked
    # against Thornswood's main, and the run starts on Ops's main.
    box-run.yml:
      repo: ThornswoodRP/Thornswood-Ops
      verbs: scripts/vps/gate/verbs.json
    nexus-run.yml:
      verbs: scripts/release/nexus-verbs.json
    release.yml: {}
    release-tag.yml: {}
    # The site's Cloudflare Tunnel (Thornswood #5334): one Ops run asks the
    # box for its seal key, seals the API token to it on a hosted runner and
    # hands it back to the box, so no key comes in from whoever starts it.
    # It takes no gate line, so each input it takes is named here with the
    # pattern its value must match, and the gate holds the line it builds to
    # verbs.json again. Ops's run note says when switch goes (after the
    # tw_decide card); back is the undo.
    tunnel.yml:
      repo: ThornswoodRP/Thornswood-Ops
      required: [mode]
      inputs:
        mode: "install|switch|back"
        wait: "[0-9]{0,3}"
        recipient: "[A-Za-z0-9+/=<>]{0,4096}"
  # Never started by a Bot, whatever the request says.
  refused_verbs: [Set-NexusKey]
  # A verb that only runs with Patrick's decision record for that exact commit.
  patrick_switches:
    New-NexusRevision: [Publish]

# Branches: a worker pushes only its own, named <bot>/<issue>-<what>.
branches:
  pattern: "^{bot}/[0-9]+-[a-z0-9][a-z0-9-]{0,60}$"
  # Bramble's App pushes the workflow change Magpie wrote to Magpie's branch.
  bramble_may_push_for: [magpie]

claims:
  prefix: "claimed: "
  # The six Bot claim labels (each Bot's claim_label above) share one colour,
  # "distinct from the old labels" (04 section 6.1). Bramble makes them, and
  # only them, with tw_git claim_labels. e8590c (orange) is used by no label
  # on Thornswood, Thornswood-Ops or skymp (all 84 read 31 Oct); the old
  # claim labels are 5319e7 (Claude and the Grok lanes), 10a37f (ChatGPT)
  # and 0e8a16 (Codex).
  label_color: "e8590c"
  label_description: "Claimed by {name}, a Thornswood Hermes Bot"
  # Never put on a new claim. Kept for history.
  retired_labels:
    - "claimed: Claude"
    - "claimed: ChatGPT"
    - "claimed: Codex"

# Hands off (Patrick, 30 Oct). Their issues, PRs, branches and labels are
# never touched by a Bot.
hands_off:
  people: [WiccanDjinn, Jhinswife]
  lanes:
    names: [Anvil, Herald, Waystone, Wyrd, Smeagle, Codex]
    labels:
      - "claimed: Anvil"
      - "claimed: Herald"
      - "claimed: Waystone"
      - "claimed: Wyrd"
      - "claimed: Smeagle"
      - "claimed: Codex"
    branch_prefixes: [anvil/, herald/, waystone/, wyrd/, smeagle/, codex/, grok/]

# The model order with no extra spend. A route a Bot may not use is not in
# its chain at all. Routes 2 and 4 stay out of every chain until the
# admission proxy exists (06 section 6.3).
routes:
  - id: max
    provider: anthropic
    model: claude-opus-5-5
    who: all
    risk: any
  - id: credits
    provider: anthropic
    model: claude-opus-5-5
    via: admission-proxy
    key_env: TW_CLAUDE_CREDITS_KEY
    who: [bramble]
    risk: low
    needs: admission-proxy
    # Read from Patrick's claude.ai Billing page, 30 Oct: $200 a month, new
    # credit on the 21st (next 21 Nov). Nothing purchased, no auto-reload.
    # The queue stops admitting new work below the margin, so a long turn
    # never hits the hard stop halfway.
    monthly_usd: 200
    refresh_day: 21
    stop_below_usd: 10
    # The proxy's running estimate, per million tokens (Anthropic's API
    # prices for claude-opus-5-5 as of 6 Oct 2026). A cache write with no
    # TTL breakdown counts at the 1-hour price, so the estimate runs high.
    price_usd_per_mtok:
      input: 4.00
      output: 20.00
      cache_read: 0.20
      cache_write_5m: 5.00
      cache_write_1h: 8.00
  - id: chatgpt
    provider: openai-codex
    model: gpt-6.1-sol
    who: all
    risk: any
  - id: qwen
    provider: custom
    via: admission-proxy
    key_env: TW_QWEN_TOKEN
    # llama-server on One serves one model whatever this says; the name is
    # what Hermes's custom provider sends.
    model: qwen3.5-9b
    who: all
    risk: low
    needs: admission-proxy
    needs_one: true

# Providers no profile may name anywhere in its config: each bills by use.
paid_providers:
  - openrouter
  - openai
  - openai-api
  - ai-gateway
  - nous
  - copilot
  - zai
  - kimi-coding
  - minimax
  - minimax-cn
  - deepseek
  - nvidia
  - gmi
  - upstage
  - bedrock
  - vertex
  - gemini
  - google
  - xai

# Secrets on the Oracle box, by name only. Values are never read.
secrets:
  # The one named exception (Patrick, 30 Oct), only in the gateway's own .env.
  oracle_allowed:
    - name: DISCORD_BOT_TOKEN
      where: root
  # Settings that sit beside it and hold no secret.
  oracle_settings:
    - DISCORD_ALLOWED_USERS
    - DISCORD_HIDE_SLASH_COMMANDS
    - DISCORD_COMMAND_SYNC_POLICY
    - DISCORD_REQUIRE_MENTION
    - DISCORD_HOME_CHANNEL
    - DISCORD_HOME_CHANNEL_NAME
  # The second named exception (Patrick, 30 Oct, report page): one Nexus key
  # that only downloads a new collection revision's plugins for the game
  # data checks. It is held by its own Linux user, never by Hermes, a broker a
  # Bot can ask, or a sandbox, so any Nexus name in Hermes's files is refused.
  # Not set yet: no real tokens on the VM before the Apps exist.
  oracle_other_users:
    - name: TW_GAMEDATA_NEXUS_KEY
      user: tw-gamedata
      use: download the collection's published revision files only
    # Phase 2: the real keys for routes 2 and 4 live only in
    # /etc/thornswood/proxy.env, read by the admission proxy's own user.
    # Hermes holds none of them; each Bot holds only its proxy token.
    - name: TW_CLAUDE_CREDITS_KEY
      user: tw-proxy
      use: route 2, added by the admission proxy to Bramble's low-risk turns
    - name: QWEN_API_KEY
      user: tw-proxy
      use: route 4, added by the admission proxy to low-risk Qwen packets
  # Allowed by the plan once their route exists, held by the service user
  # only. Each Bot's own admission-proxy token, in its profile's .env: it
  # reaches only the loopback proxy, which checks the turn's ticket.
  oracle_later:
    - name: TW_PROXY_TOKEN
      where: each_profile
  # Set by Patrick's Hermes on 30 Oct for route 4, in its own file
  # (/home/hermes/.config/thornswood/qwen.env, mode 600: QWEN_BASE_URL and
  # QWEN_API_KEY). The Phase 2 install moves it into proxy.env; after that
  # nothing under the hermes user names a route's real key.
  qwen_env_file: /home/hermes/.config/thornswood/qwen.env
  # Never on the Oracle box, by name pattern. ANTHROPIC_API_KEY would make
  # Hermes spend the credits ahead of the subscription.
  forbidden_names:
    - "ANTHROPIC_API_KEY"
    - "TW_CLAUDE_CREDITS_KEY"
    - "QWEN_API_KEY"
    - "TW_QWEN_TOKEN"
    - "GH_TOKEN"
    - "GITHUB_TOKEN"
    - "GITHUB_APP_*"
    - "*NEXUS*"        # only tw-gamedata holds one, outside Hermes's reach
    - "DESK_KEY*"
    - "*SIGNING*"
    - "AZURE_*"
    - "CLOUDFLARE_*"
    - "CF_API_*"
    - "*BOX_KEY*"
    - "*BRIDGE_TOKEN*"
    - "OPENAI_API_KEY"
    - "OPENROUTER_API_KEY"
    - "THORNSWOOD_NOTICE_*"
    - "GOOGLE_*"
    # Only Patrick instructs Hermes on Discord.
    - "DISCORD_ALLOW_ALL_USERS"
    - "DISCORD_ALLOW_BOTS"
    - "DISCORD_ALLOWED_ROLES"
  # A name not listed above is refused when it is shaped like a secret (a
  # KEY, TOKEN, SECRET, PASSWORD, CREDENTIAL, PRIVATE, AUTH or COOKIE part).
  # Hermes's own settings in the same files hold no secret and pass.
  secret_name_parts: [KEY, KEYS, TOKEN, TOKENS, SECRET, SECRETS, PASSWORD, PASSWD, PASS, PASSPHRASE, CREDENTIAL, CREDENTIALS, PRIVATE, AUTH, COOKIE, COOKIES, PAT]
  forbidden_files:
    - signing.json
    - thornswood_ed25519
    - thornswood-box-token
    - "*.pfx"
    - "*.p12"
    - "*private-key*.pem"
    - "*.private-key.pem"
    # A GitHub login in the Bots' user would put Patrick's own token, and his
    # rate limit, in their reach. The Bots call GitHub only through tw-git,
    # with the two Apps' installation tokens.
    - hosts.yml
    - .git-credentials

notifications:
  # Push only for a real decision, and only once per card revision.
  push_kinds: [decision, main-approval]
  lock_screen_text: "Thornswood needs you"
  link: "/cards/{card_id}?rev={revision}"

# Bramble wakes when GitHub finishes a pull request's checks (Patrick's answer
# A on q-hermes-bramble-wake, 1 Nov). Cause: nothing reached Bramble when a
# check finished, so every merge and hand-back waited for someone to nudge it.
# Bramble's App sends its check_suite and pull_request events to Hermes's own
# webhook receiver on the gateway's loopback port; Tailscale Funnel publishes
# that one path, and only it, on funnel_port. GitHub signs each event with the
# secret in secret_file (root's alone, made by deploy/install.sh); systemd
# hands it to the gateway, and the install gives it to the App's webhook
# setting with the App's own key, so nobody copies it.
wake:
  app: bramble
  port: 8644
  route: github-checks
  funnel_port: 8443
  secret_file: /etc/thornswood/github-webhook.env
  repos: [app, ops, fork]

decisions:
  answered_by: EvilPatrick06
  # Every record is used once. Main, publish and cutover records also die
  # when the store is restored from a backup.
  default_expiry_hours: 72

# Toolsets each Bot never has. The guard also refuses their tools by name.
toolsets:
  never:
    - browser
    - code_execution
    - computer_use
    - connections
    - catalog
    - image_gen
    - video_gen
    - tts
    - web
    - search
    - x_search
    - discord
    - discord_admin
    - delegation
  workers_never:
    - cronjob

# Phase 2: the brokers, the admission queue and proxy, the slices and the
# backups (08 sections 2, 3, 4 and 7; 02 sections 7 and 8; 06 section 6).
# The Bots never hold anything named here; each service runs as its own user.
brokers:
  # Patrick sets ready to true by a PR once the install and the canary
  # attack tests pass on the VM: then every turn needs a ticket from the
  # fleet queue and the Bots get the tw_git and tw_files tools. tier_b then
  # takes the generic shell and file writes away, so work trees change only
  # through tw_files (08 section 2).
  # On 31 Oct the install at f0d45bbf held on the VM: the limits check was
  # ok, and tw-canary printed ten PASS lines (attacks 2, 3, 5 and 18).
  ready: true
  tier_b: false
  # The code every service runs is a root-owned copy of the merged commit,
  # never the hermes user's release folder, which hermes can write.
  install_root: /opt/thornswood-hermes
  users:
    gateway: hermes
    policy: tw-policy
    files: tw-files
    git: tw-git
    proxy: tw-proxy
    backup: tw-backup
  # One execution user per worker Bot (Tier B). Bramble has none: it acts
  # only through the brokers.
  exec_users:
    rift: tw-rift
    sprocket: tw-sprocket
    echo: tw-echo
    magpie: tw-magpie
    wisp: tw-wisp
  # Who may connect to each socket, by Unix user, checked from the peer's
  # credentials on every connection.
  # The group is only who may connect; each op still checks the caller's
  # user from SO_PEERCRED.
  sockets:
    policy:
      path: /run/tw/policy/policy.sock
      group: tw-policy-clients
      clients: [hermes, tw-git, tw-files, tw-proxy, root]
    git:
      path: /run/tw/git/git.sock
      group: tw-git-clients
      clients: [hermes, root]
    files:
      path: /run/tw/files/files.sock
      group: tw-files-clients
      clients: [hermes, root]
    # The Bots' route to the decision core (#49), served by tw-decide-bots as
    # the core's own user.
    decide:
      path: /run/tw/decide-bots/bots.sock
      group: tw-decide-bots
      clients: [hermes, root]
    # tw-git's own socket on tw-decide-bots (#132): Patrick's answers on
    # Bramble's outside pull request cards, read only, so tw-git closes the
    # pull request or lets the author's work merge only on his answer.
    decide_git:
      path: /run/tw/decide-git/git.sock
      group: tw-decide-git
      clients: [tw-git, root]
  state:
    policy_db: /srv/tw/policy/policy.db
    git_mirrors: /srv/tw/git
    work: /srv/tw/work
    spool: /srv/tw/spool
    backups: /srv/tw/backups
    snapshots: /srv/tw/snapshots
  # Sizes per Bot tree (08 section 3).
  files:
    max_write_bytes: 2097152
    max_patch_bytes: 1048576
    max_changed_files: 2000
    check_minutes: 10
    # By group quota on tw-work-<bot>: every file in a Bot's tree has that
    # group (setgid directories), whoever wrote it.
    disk_quota_gb: {default: 10, wisp: 25}
    work_group_prefix: tw-work-
    # The keys a work tree's .git/config may hold. Anything else (a filter,
    # a textconv, an fsmonitor, a pager, an ssh command) stops every git
    # command in that tree until it is cleaned up.
    git_config_keys:
      - core.repositoryformatversion
      - core.filemode
      - core.bare
      - core.logallrefupdates
      - core.ignorecase
      - core.precomposeunicode
      - "remote.origin.url"
      - "remote.origin.fetch"
      - "branch.*.remote"
      - "branch.*.merge"
    # Who commits: the Bot by name, at an address that reaches nobody.
    commit_email: "{bot}@bots.thornswood.invalid"
    # What a check may run (03-LINUX_WORK_SPLIT.md; the public CLAUDE.md
    # harness forms). One harness at a time; never Run-Gate.ps1, a launcher,
    # an installer or an engine build.
    check_commands:
      - ["node", "tests/test-{name}.js"]
      - ["pwsh", "-NoProfile", "-File", "tests/test-{name}.ps1"]
      - ["python3", "tests/test-{name}.py"]
      - ["pwsh", "scripts/dev/Check-Words.ps1"]
    check_limits:
      MemoryMax: 2G
      CPUQuota: 100%
      TasksMax: 256
  # The two Apps' private keys, readable only by tw-git (mode 0400).
  apps:
    bramble:
      app_id: 5547080
      installation_id: 177392923
      key_file: /etc/thornswood/apps/thornswood-bramble.pem
    workers:
      app_id: 5547094
      installation_id: 177393064
      key_file: /etc/thornswood/apps/thornswood-workers.pem

# The admission proxy for routes 2 and 4 (06 section 6.3). A loopback
# endpoint run by tw-proxy: it maps each Bot's proxy token to the Bot, asks
# tw-policy whether that Bot's current turn may use the route, and only then
# adds the real key. The credits key and the Qwen token live in its own file,
# never in Hermes's home.
admission_proxy:
  listen: 127.0.0.1:8611
  env_file: /etc/thornswood/proxy.env
  # Each Bot's profile .env holds only its proxy token under this name.
  token_env: TW_PROXY_TOKEN
  tokens_file: /etc/thornswood/proxy-tokens.json
  upstreams:
    credits:
      url: https://api.anthropic.com
      key_env: TW_CLAUDE_CREDITS_KEY
    qwen:
      url_env: QWEN_BASE_URL
      key_env: QWEN_API_KEY
  max_request_bytes:
    credits: 33554432
    # About 131,072 tokens of Qwen context at four bytes a token.
    qwen: 524288
  qwen_max_tokens: 8192
  # Each Qwen request holds the one Qwen lease until One's answer ends.
  qwen_lease_seconds: 900
  upstream_timeout_seconds: 900
  # Routes 2 and 4 enter the Bots' chains only when Patrick sets this true by a
  # PR here, after the proxy's attack tests passed on the VM (06 section 6.3).
  ready: false

# The fleet admission queue (08 section 7; 02 section 8.5). Past the pilot
# since 1 Nov (Patrick picked 6 turns and 2 checks): the pilot's one turn
# and no checks queued every Bot behind one other and refused every
# run_check, while what really limits the fleet is measured at each
# admission (admit and drain below: free memory, swap, memory pressure,
# load, disk). So the counts are ceilings with a cause, not guesses:
# - model_turns: one turn per Bot, the most that can be useful, since each
#   Bot's chat runs one turn at a time. The 8:46 AM 429 on 1 Nov came with
#   no Bot running (the shared sign-in's own allowance was spent), so a
#   lower count would not have stopped it.
# - sandbox_jobs: as many checks as fit in tw-sandbox.slice's MemoryMax at
#   each check's own MemoryMax (brokers.files.check_limits), 4G / 2G.
# Tests hold both to those sources, so either moves with its cause.
admission:
  stage: after
  model_turns: {pilot: 1, after: 6}
  sandbox_jobs: {pilot: 0, after: 2}
  mutating_ops: 1
  room_round_turns: 6
  queue_max_waiting: 100
  queue_new_per_hour: 20
  admit:
    mem_available_gb: 3.0
    sandbox_mem_available_gb: 4.0
    swap_used_mb: 512
    psi_memory_some_avg60: 10.0
    load5: 1.6
    srv_free_gb: 25
    boot_free_gb: 10
  drain:
    mem_available_gb: 1.5
    swap_used_gb: 2.0
    psi_memory_full_avg10: 5.0
    disk_free_gb: 15
  # A capacity or quota wait is a parked task with its reason, never a failure.
  route_backoff_seconds: {first: 60, max: 14400}

# systemd slices and their hard caps (02 section 8.4). The VM is 4 OCPU and
# 24 GB (built 30 Oct); these are the plan's caps, kept until the canary
# measures Hermes's real size. A cap changes only with Patrick's approval.
slices:
  tw-hermes.slice:
    MemoryHigh: 2560M
    MemoryMax: 3G
    CPUWeight: 200
    CPUQuota: 150%
    TasksMax: 512
  tw-brokers.slice:
    MemoryHigh: 400M
    MemoryMax: 512M
    CPUWeight: 100
    CPUQuota: 50%
    TasksMax: 128
  tw-sandbox.slice:
    MemoryHigh: 3584M
    MemoryMax: 4G
    CPUWeight: 50
    CPUQuota: 100%
    TasksMax: 1024
  # Tier A: the hermes user's own manager runs the rootless podman containers,
  # so its user slice (user-<uid of hermes>.slice) carries the sandbox caps too.
  hermes-user.slice:
    MemoryHigh: 3584M
    MemoryMax: 4G
    CPUQuota: 100%
    TasksMax: 1024

# Backups (02 section 7, OPEN item 7). Encrypted on the VM to Patrick's age
# public key. Never in an archive: sign-ins, .env files, keys. Until 31 Oct
# One pulled them over SFTP as tw-backup and uploaded them to Google Drive;
# since Patrick's answer A on q-retire-hermes-one (#2862) the VM copies them
# to Drive itself (offsite below), and the game box's nightly comes the same
# way through an add-only drop.
backups:
  age_recipient_file: /etc/thornswood/backup-recipient.txt
  archive_keep_days: 14
  snapshot_keep_hourly: 24
  snapshot_keep_daily: 7
  snapshot_cap_gb: 5
  include:
    - /home/hermes/.hermes
    - /srv/tw/policy
  exclude_names:
    - auth.json
    - .env
    - "*.pem"
    - "*.key"
    - "*.pfx"
    - "*.p12"
    - credentials*
    - hosts.yml
    - .git-credentials
    - "*.db-wal"
    - "*.db-shm"
  exclude_dirs: [cache, image_cache, audio_cache, document_cache, node_modules, hermes-agent, logs, checkpoints, tools, installs]
  # Off-site copies (thornswood_brokers/offsite.py, tw-offsite.service).
  # Patrick, 31 Oct: Google Drive, through the VM, so a stolen box cannot
  # delete the copies it sent. The Drive sign-in is tw-offsite's alone.
  offsite:
    remote: thornswood-gdrive
    rclone_config: /var/lib/tw-offsite/rclone.conf
    hermes_folder: Thornswood-Hermes-Backups
    box_folder: Thornswood-Box-Backups
    drive_keep_days: 90
    # The box's copies hold people's records, and the public privacy page
    # promises off-box copies are kept 30 days with at least seven retained
    # (Thornswood site/data/site/privacy.md, Backups), on Drive as here.
    box_drive_keep_days: 30
    # A backup of either kind older than this is a missed night, said as a
    # failure (One's Check-OffBox used 26 hours).
    fresh_hours: 26
    box_drop: /srv/tw/boxdrop
    box_store: /srv/tw/boxbackups
    box_keep_days: 30
    box_keep_newest: 7
    box_address: 192.135.112.23
    # The box's public key, in this repository so a merge is how it changes.
    box_key_file: deploy/keys/box-drop.pub

# The VM follows main by itself (thornswood_brokers/follow_main.py,
# tw-follow-main.timer). Patrick's answer A on q-retire-hermes-one, 31 Oct
# (#2862): no other machine sends it a commit. It reads this repository with
# its own read-only deploy key, root's alone.
follow_main:
  url: git@github.com:ThornswoodRP/TWHermesAgents.git
  read_key: /etc/thornswood/hermes-read-key
  known_hosts: /etc/thornswood/github_known_hosts
  mirror: /srv/tw/follow/thornswood-hermes.git
  state_file: /var/lib/thornswood/follow-main.json
  ci_user: tw-ci
  ci_dir: /srv/tw/ci
  tests_minutes: 20
  hermes_user: hermes
  hermes_releases: /home/hermes/thornswood-hermes/releases
  # Its install wrote this file, so the decision core is installed here and each
  # merge installs it again (deploy/decisions/install.sh keeps --room and --origin from it).
  decide_env: /etc/thornswood/tw-decide.env
  # The core's store, which root reads (read only) for its schema number: a
  # store a release has migrated cannot be opened by an older release.
  decide_db: /srv/tw/decide/core.db
  # Whose store it is, and the core's own interpreter: a put-back over a
  # migrated store runs the failed release's downgrade as this user, with it.
  decide_user: tw-decide
  decide_python: /opt/thornswood-hermes/decisions-venv/bin/python3
  # While this file exists the follower fetches and installs nothing. An install
  # starts the timer again, so pausing is this file, never stopping the timer.
  pause_file: /etc/thornswood/follow-main.paused
